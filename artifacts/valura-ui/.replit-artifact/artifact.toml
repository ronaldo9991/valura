kind = "web"
previewPath = "/"
title = "AENS X VALURA"
version = "1.0.0"
id = "artifacts/valura-ui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19972

[services.development]
run = "pnpm --filter @workspace/valura-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/valura-ui", "run", "build" ]
publicDir = "artifacts/valura-ui/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19972"
BASE_PATH = "/"
